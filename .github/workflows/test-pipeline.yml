# GoodBooks CI/CD Test Pipeline
# Runs on: push to main, pull requests to main
name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-api-tests:
    name: Unit & API Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-test.txt

      - name: Run unit and API tests
        env:
          MONGO_URI: mongodb://localhost:27017/
          SECRET_KEY: test-secret-key
        run: |
          cd backend && python -m pytest ../tests/test_auth.py ../tests/test_api.py ../tests/test_routes.py -v --ignore=../tests/e2e/ --ignore=../tests/e2e
        continue-on-error: false

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: unit-and-api-tests

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-test.txt
          playwright install chromium --with-deps

      - name: Start Flask app
        env:
          MONGO_URI: mongodb://localhost:27017/
          SECRET_KEY: test-secret-key
        run: |
          cd backend && python app.py &
          sleep 5

      - name: Run E2E tests
        env:
          BASE_URL: http://localhost:5000
        run: |
          pytest tests/e2e/ -v --timeout=30
        continue-on-error: true  # E2E may fail in CI; adjust as needed

  test-report:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-and-api-tests, e2e-tests]
    if: always()
    steps:
      - run: echo "Test pipeline completed. Check job results above."
