# GoodBooks CI/CD Test Pipeline
# Runs on: push to main, pull requests to main
name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression-tests:
    name: Regression Tests + Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-test.txt

      - name: Create evidence directory
        run: mkdir -p docs/midterm_evidence

      - name: Run non-E2E regression suite with coverage
        env:
          MONGO_URI: mongodb://localhost:27017/
          SECRET_KEY: test-secret-key
          COVERAGE_FILE: /tmp/goodbooks_midterm_coverage
        run: |
          python -m pytest tests --ignore=tests/e2e \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml:docs/midterm_evidence/coverage.xml \
            --cov-report=json:docs/midterm_evidence/coverage.json \
            --junitxml=docs/midterm_evidence/pytest-results.xml -v
        continue-on-error: false

      - name: Apply quality gates
        run: python scripts/quality_gate.py

      - name: Upload regression artifacts
        uses: actions/upload-artifact@v4
        with:
          name: regression-artifacts-py${{ matrix.python-version }}
          path: docs/midterm_evidence/

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: regression-tests

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-test.txt
          playwright install chromium --with-deps

      - name: Start Flask app
        env:
          MONGO_URI: mongodb://localhost:27017/
          SECRET_KEY: test-secret-key
        run: |
          cd backend && python app.py &
          sleep 5

      - name: Run E2E tests
        env:
          BASE_URL: http://localhost:5000
        run: |
          pytest tests/e2e/test_playwright.py -v
        continue-on-error: false

  test-report:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [regression-tests, e2e-tests]
    if: always()
    steps:
      - run: echo "Test pipeline completed. Check job results above."
