{% extends "base.html" %}

{% block title %}Edit Profile - GoodBooks{% endblock %}

{% block content %}
<div class="form-container">
    <div class="page-header" style="margin-bottom: 2rem;">
        <h1>Edit Profile</h1>
        <p>Update your profile information</p>
    </div>

    <form method="post">
        <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" value="{{ user.username }}" class="form-input" disabled>
            <small style="color: var(--text-secondary); font-size: 0.875rem;">Username cannot be changed</small>
        </div>

        <div class="form-group">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" id="name" name="name" value="{{ user.name or '' }}" class="form-input">
        </div>

        <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email" value="{{ user.email or '' }}" class="form-input">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="/profile" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
