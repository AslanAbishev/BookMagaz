{% extends "base.html" %}

{% block title %}Reset Password - GoodBooks{% endblock %}

{% block content %}
<div class="form-container">
    <div class="page-header" style="margin-bottom: 2rem;">
        <h1>Reset Password</h1>
        <p>Enter your new password below</p>
    </div>

    <form method="post">
        <input type="hidden" name="token" value="{{ token }}">
        
        <div class="form-group">
            <label for="password" class="form-label">New Password *</label>
            <input type="password" id="password" name="password" class="form-input" required autofocus minlength="6">
            <small style="color: var(--text-secondary); font-size: 0.875rem;">
                Password must be at least 6 characters long
            </small>
        </div>

        <div class="form-group">
            <label for="confirm_password" class="form-label">Confirm New Password *</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-input" required minlength="6">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Reset Password</button>
            <a href="/login" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
